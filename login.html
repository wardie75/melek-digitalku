<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Melek Digital</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-visual">
    <div class="dawn-visual" aria-hidden="true"><div class="eye-line"></div></div>
    <blockquote>"Nggak perlu latar belakang teknologi untuk mulai melek AI. Kamu cuma butuh niat dan 4 jam pertama."
      <cite>— Tim Melek Digital</cite>
    </blockquote>
  </div>
  <div class="auth-form-wrap">
    <a href="index.html" class="brand"><span class="dot"></span>Melek Digital</a>
    <h1 style="font-size:26px">Selamat datang kembali</h1>
    <p class="muted" style="margin-top:8px">Masuk untuk melanjutkan belajar kelas kamu.</p>

    <form style="margin-top:28px" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="kamu@email.com">
      </div>
      <div class="field">
        <label for="login-pass">Kata Sandi</label>
        <input type="password" id="login-pass" required placeholder="••••••••">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft)">
          <input type="checkbox" style="accent-color:var(--coral)"> Ingat saya
        </label>
        <a href="#" style="font-size:13.5px;color:var(--coral);font-weight:600">Lupa sandi?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>

    <div class="auth-divider">atau</div>
    <button class="btn btn-ghost-light btn-block" type="button">Masuk dengan Google</button>

    <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar gratis</a></p>
  </div>
</div>
</body>
</html>
